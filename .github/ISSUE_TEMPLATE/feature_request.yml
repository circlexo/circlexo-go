name: Feature request
description: Suggest an idea or improvement for circlexo-go.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Big or open-ended ideas are often better started in [Discussions → Ideas](https://github.com/circlexo/circlexo-go/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Config and discovery
        - Token verifier
        - oidc (sign-in)
        - middleware
        - entitlements
        - usage
        - webhooks
        - service tokens
        - mcp
        - manifest and CLI
        - cms (Nasaq)
        - circlexotest
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
